name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # better-sqlite3 can compile from source when a matching prebuilt binary
      # is unavailable. node-gyp 9 requires distutils, which Python 3.12+
      # removed from the standard library.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: Install agent packages
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm ci
      - name: Install desktop packages
        working-directory: desktop
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm ci
      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No signing certificate secret: the app will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          signing_identity="${MACOS_SIGNING_IDENTITY:-SEWA Monitoring Agent Signing}"
          security find-certificate -c "$signing_identity" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          echo "CSC_NAME=$signing_identity" >> "$GITHUB_ENV"
          echo "has_identity=true" >> "$GITHUB_OUTPUT"
      - name: Build DMGs
        working-directory: desktop
        run: npm run dist:mac
      - name: Verify applications
        env:
          HAS_SIGNING_CERT: ${{ steps.cert.outputs.has_identity }}
        run: |
          for pair in "mac:x64" "mac-arm64:arm64"; do
            app="desktop/release/${pair%%:*}/SEWA Monitoring Agent.app"
            arch="${pair##*:}"
            lipo -info "$app/Contents/MacOS/SEWA Monitoring Agent"
            test -f "$app/Contents/Resources/agent/agent.cjs"
            lipo -info "$app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/darwin-$arch.node"
            if [ "$HAS_SIGNING_CERT" = "true" ]; then
              codesign --verify --deep --strict "$app"
            fi
          done
      - name: Report DMG sizes
        run: ls -lh desktop/release/*.dmg
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SEWA-Monitoring-Agent-macOS
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30
